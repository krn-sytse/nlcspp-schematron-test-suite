name: Build VSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Upload .vsix as artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: ./*.vsix
